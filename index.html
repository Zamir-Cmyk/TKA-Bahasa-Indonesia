<script>
const G=[
{t:"Tradisi Buwuhan (No. 1–4)",p:"Buwuhan merupakan bagian dari budaya masyarakat Jawa, khususnya di Surabaya. Buwuhan merujuk pada kegiatan memberi bantuan berupa barang, uang, atau tenaga kepada seseorang yang sedang mengadakan hajatan. Tradisi ini mencerminkan gotong royong dan solidaritas, namun tidak lepas dari unsur pertukaran: masyarakat meyakini bantuan akan kembali dalam bentuk serupa ketika si pemberi mengadakan hajatan, sehingga buwuhan dipandang sebagai \"utang tidak tertulis\" yang menimbulkan kewajiban moral.\n\nDalam praktiknya, buwuhan meringankan beban tuan rumah, tetapi dapat menimbulkan tekanan psikologis bagi penerima bantuan. Hal ini menyebabkan terbaginya cara pandang: ada yang melihatnya sebagai tolong-menolong, ada yang menganggapnya sistem utang piutang berbasis sosial. Apabila ada keharusan pengembalian, maka secara hukum dan etika buwuhan telah bergeser dari semangat gotong royong menjadi kewajiban ekonomi. Oleh karena itu, pemahaman masyarakat terhadap tradisi buwuhan perlu diluruskan agar nilai luhur tolong-menolong tetap terjaga tanpa menimbulkan beban yang tidak perlu.",s:"Rachmawati & Anwar (2021), Jurnal Ekonomika dan Bisnis Islam (ringkasan)",q:[
{q:"Apa makna kata hajatan pada teks tersebut?",o:["Kegiatan kerja bakti membersihkan lingkungan sekitar.","Pertemuan rutin warga untuk membahas masalah lingkungan.","Diskusi keluarga besar untuk menentukan pembagian warisan.","Permohonan bantuan yang dilakukan tuan rumah kepada tetangga.","Acara atau pesta yang diadakan untuk memperingati hal penting."],a:4},
{q:"Manakah gagasan yang mendukung ide pokok bahwa buwuhan adalah bentuk utang?",o:["Praktik buwuhan disertai dengan perjanjian utang piutang secara tertulis.","Buwuhan disertai kesepakatan untuk selalu memberi lebih dari yang diterima.","Bentuk buwuhan dapat berupa sedekah atau hibah yang harus dibayar kembali.","Buwuhan dilakukan oleh tetangga dan kerabat sebagai bentuk pertukaran solidaritas.","Penerima buwuhan merasa harus mengembalikan bantuan yang diterima di kemudian hari."],a:4},
{q:"Hubungan makna paragraf kedua dan ketiga adalah ....",o:["perbedaan jenis buwuhan berdasarkan jenis acara yang dilangsungkan","penjelasan sebab dan akibat dari perbedaan pandangan mengenai buwuhan","penjelasan dampak buruk dari adanya pandangan buwuhan sebagai sedekah","perbedaan tata cara buwuhan pada beberapa kelurahan atau desa di Surabaya","penjelasan hubungan hukum agama dengan pengertian masyarakat terhadap buwuhan"],a:1},
{q:"\"Oleh karena itu, pemahaman masyarakat terhadap tradisi buwuhan perlu diluruskan agar nilai luhur tolong-menolong tetap terjaga tanpa menimbulkan beban yang tidak perlu.\" Kalimat tersebut dapat menjadi kesimpulan yang sesuai teks argumentasi tersebut karena ....",o:["merangkum sebab-akibat dari adanya tradisi buwuhan di wilayah Surabaya","menyimpulkan ketidaksetujuan masyarakat terhadap penghapusan tradisi buwuhan","menyangkal pandangan negatif yang ada di masyarakat untuk pelestarian buwuhan","menyimpulkan berbagai pandangan masyarakat terhadap konsep buwuhan","menggarisbawahi solusi untuk melestarikan tradisi buwuhan di seluruh wilayah Jawa"],a:3}]},
{t:"Layur, Teruslah Berlayar (No. 5–8)",p:"(Ringkasan cerita) Layur cemas menanti Bapak yang sudah tiga hari terlama di laut. Ia menolak berpikiran buruk dan berdoa agar Bapak pulang selamat. Layur ingat Bapak dulu pembuat bondet (bom ikan) paling disegani di dusun. Suatu ketika gudang bondet meledak, separuh rumah luluh lantak dan melukai anak semata wayang. Itulah titik balik yang amat disesali Bapak; ia dan warga Dusun Prau meninggalkan cara menangkap ikan dengan bondet. Lamat-lamat terlihat layar biru. Layur turun dari perahu dan berseru kesal, \"Bapak dari mana? Bapak sudah tiga hari telat pulang!\" Matanya berkaca-kaca, menahan rindu dan cemas.",s:"Anang YB, Layur, Teruslah Berlayar (dengan pengubahan; ringkasan)",q:[
{q:"Berdasarkan teks tersebut, bagaimana sifat yang dimiliki oleh Layur?",o:["Nekat dan optimis","Mudah cemas dan tabah","Penuh harap dan kasih sayang","Suka menyendiri dan tegas","Cepat panik dan menyalahkan keadaan"],a:2},
{q:"Apa yang menyebabkan Layur kesal kepada Bapak?",o:["Tidak pamit kepada Layur saat hendak berlayar","Tidak membawa banyak ikan dari laut","Tidak setuju Layur menunggu terlalu lama di pantai","Tidak kunjung pulang setelah enam hari melaut","Tidak menepati janjinya untuk pulang tepat waktu ketika melaut"],a:4},
{q:"Bagaimana kisah yang sesuai untuk menutup cerita Layur merasa lega pada cerita tersebut?",o:["Bapak meminta maaf pada Layur dan menceritakan penyebabnya pulang terlambat","Bapak membimbing Layur pulang dan berjanji untuk tidak pulang terlambat lagi","Bapak memeluk Layur dan merasa senang karena akhirnya ia bisa bertemu putrinya kembali","Layur membereskan sampan dan memberikan hasil tangkapan yang tidak seberapa kepada Bapak","Layur berterima kasih kepada Bapak karena telah menunggunya pulang dari melaut berhari-hari"],a:2},
{q:"Bagaimana reaksi yang ditunjukkan oleh Bapak ketika rumahnya luluh lantak dan bondet buatannya melukai Layur?",o:["Merasa trauma dan membutuhkan waktu untuk menyendiri","Menunjukkan respons yang biasa seperti tidak terjadi apa-apa","Sangat terkejut dan sungguh menyesal atas apa yang dilakukan","Marah terhadap orang lain dan merasa panik yang luar biasa","Bingung dan berusaha mencerna terhadap apa yang telah terjadi"],a:2}]},
{t:"Pantai Bersih Tanpa Sampah (No. 9–11)",p:"Pemerintah setempat gencar mengampanyekan \"Pantai Bersih Tanpa Sampah\" dengan spanduk dan papan peringatan, namun kenyataannya sering berbeda. Suatu sore, Pak Wayan, nelayan tua, membersihkan jaringnya di tepi pantai. Sekelompok turis muda berpose berfoto: \"Pas banget buat konten 'liburan ramah lingkungan'!\" Setelah puas, mereka pergi meninggalkan botol plastik, bungkus keripik, dan puntung rokok yang disembunyikan di balik semak. Pak Wayan memungut sampah itu satu per satu. Seorang petugas kebersihan datang: \"Sudah banyak lagi ya sampahnya?\" Pak Wayan: \"Itu namanya 'sampah estetik'. Cuma bagus di foto, tapi busuk di mata dan bau di hidung.\" Petugas: \"Kata mereka peduli lingkungan, tapi pedulinya cuma di caption media sosial.\" Malam harinya Pak Wayan melihat foto turis di media sosial dengan caption \"Surgaku, jangan kau kotori!\" dan hanya bisa tersenyum getir.",s:"Teks cerita (ringkasan)",q:[
{q:"Manakah urutan peristiwa berikut yang paling sesuai dengan isi teks?",o:["Pak Wayan melihat foto turis di media sosial → petugas kebersihan datang → turis membuat konten","Turis berfoto dan membuat konten → Pak Wayan memungut sampah → petugas kebersihan datang","Pemerintah mengampanyekan kebersihan → Pak Wayan melihat foto turis → petugas kebersihan datang","Petugas kebersihan datang → turis membuat konten di media sosial → Pak Wayan memungut sampah","Pak Wayan memungut sampah → turis membuat konten → pemerintah mengampanyekan kebersihan"],a:1},
{q:"Apa pesan moral yang disiratkan melalui dialog antara Pak Wayan dan petugas kebersihan?",o:["Menjaga kebersihan pantai adalah tanggung jawab utama pemerintah dan petugas kebersihan","Wisatawan seringkali menikmati keindahan alam tanpa memiliki kepedulian yang mendalam","Kesadaran lingkungan sejati harus dibuktikan lewat tindakan, bukan hanya kata-kata di media sosial","Media sosial bisa menjadi sarana positif untuk mengampanyekan kepedulian terhadap lingkungan","Nelayan dan petugas kebersihan sering kali menjadi pihak yang terdampak langsung oleh sampah"],a:2},
{q:"Manakah relevansi paling kuat antara sindiran dalam teks dengan realitas kehidupan sehari-hari, terutama terkait kesadaran lingkungan dan pencitraan?",o:["Kritik terhadap kampanye \"Pantai Bersih\" yang hanya menjadi slogan, menunjukkan kurangnya efektivitas program pemerintah","Sindiran bagi pembuat konten \"liburan ramah lingkungan\" hanya untuk pencitraan semata karena tetap membuang sampah sembarangan","Penggambaran turis yang kewalahan dan menghela napas mencerminkan beban kerja yang berat karena perilaku abai para pengunjung","Keadaan Pak Wayan yang terbiasa dengan pemandangan sampah di pantai menunjukkan adanya budaya pasrah terhadap masalah lingkungan","Kontras antara spanduk \"Bersih Tanpa Sampah\" dengan sampah kenangan yang ditinggalkan, menunjukkan perlunya pengawasan ketat"],a:1}]},
{t:"Pulihkan Ekosistem (No. 12–14)",p:"[Paragraf 1] Berdasarkan riset LIPI, terjadi peningkatan sampah plastik selama pandemi akibat layanan delivery makanan lewat jasa transportasi online; 96% paket dibungkus plastik tebal dan bubble wrap. Selotip, bungkus plastik, dan bubble wrap paling sering ditemukan. Sampah medis juga melonjak: KLHK menyatakan timbunan sampah medis naik 30% hingga 50%. Indonesia adalah negara ke-2 penyumbang polusi sampah di lautan (3,22 metrik ton per tahun).\n\n[Paragraf 2] Salah satu faktor penyebab masalah tersebut adalah pertambahan penduduk yang meningkatkan aktivitas manusia dan daya konsumsi, sehingga jumlah dan jenis limbah meningkat dan lingkungan tercemar. Selain sampah, penebangan pohon secara liar sampai kebakaran hutan menjadi penyumbang terbesar kerusakan ekosistem. Tanggung jawab menjaga lingkungan bukan hanya dibebankan pada pemerintah, tetapi seluruh elemen masyarakat harus bahu-membahu menjaga dan melestarikan lingkungan.\n\n[Paragraf 3] Bertepatan dengan Hari Lingkungan Hidup Sedunia... mari bersama merobohkan jurang ekologi, memulihkan ekosistem bumi dengan pengelolaan sumber daya alam yang adil dan berkelanjutan.",s:"uiad.ac.id (2021), dengan pengubahan (ringkasan)",q:[
{q:"Bagaimana hubungan makna antara paragraf 1 dan paragraf 2 dalam teks tersebut?",o:["Paragraf 2 menjelaskan akibat dari fenomena sampah yang diuraikan di paragraf 1","Paragraf 2 menyajikan solusi awal untuk permasalahan yang diperkenalkan di paragraf 1","Paragraf 2 memberikan contoh spesifik dari jenis sampah yang disebutkan di paragraf 1","Paragraf 2 mengkritisi data yang rancu tentang sampah yang disajikan di paragraf 1","Paragraf 2 menguraikan penyebab dari permasalahan yang dijabarkan di paragraf 1"],a:4},
{k:"tf",q:"Aktivitas manusia memberikan dampak besar terhadap pencemaran lingkungan di Indonesia. Data apa saja yang mendukung opini penulis tersebut? Pilih Benar atau Salah untuk setiap pernyataan.",o:["Peningkatan aktivitas manusia yang menyebabkan lingkungan tercemar didukung oleh data lonjakan timbunan sampah medis sebesar 30-50%","Tingginya jumlah dan jenis limbah didukung oleh data bahwa 96% paket dibungkus dengan plastik tebal dan bubble wrap","Kebakaran hutan yang merusak ekosistem didukung data bahwa Indonesia merupakan negara ke-2 penyumbang sampah"],a:[1,1,0]},
{q:"Mengapa penulis memilih istilah 'bahu-membahu' untuk menggambarkan peran semua pihak dalam upaya pelestarian lingkungan?",o:["Memperkuat makna pentingnya kolaborasi berbagai pihak untuk mencapai tujuan","Memberikan sedikit kesan informal yang mungkin kurang pas untuk teks opini","Mengindikasikan bahwa idiom lebih cocok digunakan untuk konteks fisik","Menyiratkan adanya paksaan atau tekanan dari satu pihak kepada pihak lain","Menunjukkan bahwa konteks ini terlalu ambigu dan tidak ada definisi yang jelas"],a:0}]},
{t:"Prospek Ekonomi Global (No. 15–17)",p:"Jakarta, 16 Juni 2025 – Perekonomian global menghadapi tantangan di tengah ketidakpastian geopolitik dan tekanan inflasi yang persisten. Analisis IMF menunjukkan divergensi dalam laju pemulihan ekonomi antarwilayah. Kenaikan harga energi dan pangan menjadi pendorong utama inflasi, dipicu gangguan rantai pasok dan konflik di Ukraina, memaksa bank sentral mempertahankan kebijakan moneter ketat yang berpotensi mengerem pertumbuhan. Sektor manufaktur melambat, sementara sektor jasa lebih tangguh. Pasar tenaga kerja relatif ketat, investasi langsung asing cenderung melambat. Ke depan, koordinasi kebijakan antarnegara menjadi kunci; para ekonom memprediksi prospek ekonomi sangat bergantung pada evolusi inflasi, respons kebijakan moneter, dan perkembangan situasi geopolitik di seluruh dunia.",s:"Dari rilis pers dan laporan Global Economic Prospects Bank Dunia, Juni 2025 (ringkasan)",q:[
{q:"Fenomena yang menggambarkan \"inflasi\" berdasarkan teks di atas adalah ...",o:["Pengencangan anggaran negara karena kurangnya barang dan jasa","Kenaikan harga barang dan jasa secara terus menerus dalam kurun waktu tertentu","Biaya yang mendorong kemandirian ekonomi hingga mampu bersaing secara global","Pergeseran tren pasar global terhadap produk-produk dari Indonesia","Lambatnya sektor manufaktur global akibat menurunnya pembelian"],a:1},
{q:"Peristiwa yang menggambarkan tantangan perekonomian global adalah ...",o:["Bank sentral di seluruh dunia mengesampingkan kebijakan moneter demi pertumbuhan ekonomi global","Geopolitik berperan penting dalam menjaga kestabilan dan kekuatan perekonomian pada skala global","Pertumbuhan ekonomi melambat sehingga memicu terjadinya resesi yang dialami masyarakat secara global","Harga energi, pangan, dan komoditas lainnya yang tidak menentu terus menekan daya beli masyarakat","Geopolitik memperlancar jalur perdagangan dan produksi sehingga menciptakan inflasi besar-besaran"],a:3},
{q:"Manakah pernyataan yang dapat menjadi kelanjutan teks tersebut?",o:["Peran aktif IMF dan Bank Dunia dalam menanggulangi krisis ekonomi dan pembentukan SDM di negara berkembang secara global","Dampak langsung kebijakan suku bunga bank sentral terhadap tingkat pengangguran di setiap negara dan menjadi masalah global","Analisis mendalam mengenai skenario dan kemungkinan-kemungkinan terkait evolusi inflasi, respons kebijakan, serta situasi geopolitik","Pentingnya investasi di sektor manufaktur untuk meningkatkan ekspor dan mengurangi gangguan rantai pasok secara global"],a:2}]},
{t:"Tari Hudoq (No. 18–21)",p:"Tari Hudoq dari suku Dayak Modang di Kalimantan Timur adalah warisan budaya yang sarat makna spiritual dan simbolis; melestarikannya adalah keharusan.\n\nPertama, Tari Hudoq adalah cerminan kearifan lokal yang mengajarkan nilai fundamental. Tarian ini bagian dari ritual keagamaan untuk menjalin hubungan harmonis dengan roh penjaga pertanian, Halaeng Heboung, dan roh pelindung umat manusia, Selo Sen. Tarian ini pengingat kuat akan ketergantungan kita pada alam.\n\nKedua, setiap elemen mengandung simbolisme: topeng kayu besar dan dedaunan melambangkan kekuatan dan perlindungan roh; gerakan tari menggambarkan keteguhan petani, dan nyanyian tradisional adalah permohonan kepada alam agar memberi keseimbangan dan kesuburan panen.\n\nKetiga, Tari Hudoq memiliki nilai edukatif tinggi bagi masyarakat luas, termasuk wisatawan, berupa pemahaman tentang pentingnya keseimbangan alam dan hubungan spiritual.\n\nKeempat, dengan demikian Tari Hudoq bukan sekadar pertunjukan, melainkan jembatan spiritual yang menghubungkan manusia dengan alam. Pelestariannya adalah investasi untuk masa depan, memastikan nilai-nilai berharga tetap hidup bagi generasi mendatang.",s:"kebudayaan.kemdikbud.go.id dan sumber lain (dengan penyesuaian; ringkasan)",q:[
{q:"Makna dari istilah Halaeng Heboung dan Selo Sen dalam teks tersebut adalah ....",o:["Jenis topeng yang digunakan dalam tari Hudoq untuk menciptakan kesan mistis","Nama-nama suku asli Dayak Modang yang menjadi leluhur pencipta tari Hudoq","Judul nyanyian tradisional yang mengiringi tiap gerakan dalam tari Hudoq","Sebutan khusus untuk roh penjaga pertanian dan roh pelindung umat manusia","Simbol kesuburan tanah dan kesejahteraan hidup masyarakat Dayak Modang"],a:3},
{q:"Tari Hudoq tidak hanya warisan budaya, tetapi juga bentuk pengajaran nilai-nilai spiritual dan ekologis yang berasal dari kearifan lokal. Pernyataan mana yang mendukung ide tersebut?",o:["Tari Hudoq menyajikan tontonan yang memukau pengunjung yang berlibur ke Kalimantan","Tari Hudoq menggunakan topeng kayu besar dan daun-daunan sebagai ciri khas penampilan","Tari Hudoq menggambarkan semangat petani suku Dayak dalam menjaga hasil panen","Tari Hudoq termasuk warisan budaya Indonesia yang mengajarkan nilai keberlanjutan","Tari Hudoq menjadi pengingat kuat akan ketergantungan manusia pada alam"],a:4},
{q:"Bagaimana keterkaitan antara paragraf ketiga dengan paragraf keempat pada teks tersebut?",o:["Paragraf ketiga dan keempat saling melengkapi argumen tentang pentingnya pelestarian Tari Hudoq","Paragraf ketiga dan keempat sama-sama menjelaskan tentang ritual pertanian dengan penekanan pada sejarah","Paragraf ketiga menguraikan makna filosofis Tari Hudoq yang sudah disinggung pada paragraf keempat","Paragraf ketiga adalah opini penulis tentang tari Hudoq yang didukung oleh data penjelas pada paragraf keempat","Paragraf ketiga menjabarkan tantangan budaya tentang tari Hudoq dan paragraf keempat berisi penyelesaiannya"],a:0},
{q:"Mengapa paragraf terakhir pada teks tersebut sudah sesuai untuk menutup isi tes tersebut?",o:["Berisi fungsi Tari Hudoq sebagai hiburan masyarakat dan dalam harapan dalam perayaan panen","Menekankan peran penting Tari Hudoq dalam menjaga pertanian dan hubungan harmonis antarwarga","Merangkum seluruh poin penting dan memberikan penegasan yang kuat tentang pelestarian tari Hudoq","Menegaskan penjelasan bahwa tari Hudoq mengandung nilai-nilai penting dan hubungannya dengan alam","Mewakili makna gerakan dan properti khas seperti topeng dan daun-daunan yang digunakan dalam pertunjukkan"],a:2}]},
{t:"Tradisi Belis (No. 22–25)",p:"Belis adalah tradisi di wilayah Indonesia timur seperti Nusa Tenggara Timur, yang dikenal dengan mas kawin atau mahar. Tradisi ini melambangkan penghormatan kepada wanita dan penyatuan keluarga. Namun, belis sering menjadi beban finansial berat bagi pihak laki-laki, memicu tekanan psikologis dan mengganggu hubungan kekeluargaan. Beberapa pihak, terutama para sesepuh desa atau orang-orang tua, kadang terlalu kukuh untuk mempertahankan tradisi dan menekan dengan nilai yang semakin naik.\n\nBelis memiliki makna yang mendalam: pengakuan atas peran penting seorang perempuan, representasi keseriusan dan komitmen pria untuk membangun keluarga, serta simbol penyatuan dua komunitas. Pada masyarakat Lamaholot, belis diwujudkan dalam gading gajah atau bala, disertai sarung tenun sutra dan ternak. Pihak keluarga perempuan memberikan balasan simbolis kepada pihak laki-laki. Tradisi ini mengajarkan keseimbangan dan saling menghargai.\n\nMeskipun mengandung nilai positif, tantangannya saat ini adalah menjaga agar tradisi tidak menjadi beban finansial yang berat. Tuntutan belis yang tinggi sering menjadi sumber tekanan; dalam beberapa kasus, perkara belis berimbas pada kesehatan mental hingga memicu tindakan tragis, seperti yang pernah terjadi di Kupang. Penundaan pernikahan diambil guna memenuhi permintaan belis. Konflik semacam ini bisa merusak hubungan dua keluarga yang harusnya harmonis.",s:"beritakini.co.id dan krajan.id (ringkasan)",q:[
{q:"Apa makna kata sesepuh pada teks tersebut?",o:["keluarga yang dihormati oleh seluruh warga desa","orang yang dituakan atau dijadikan pemimpin","masyarakat yang memiliki peran penting","pengurus atau perangkat desa yang sudah tua","laki-laki yang sudah menikah dan memiliki anak"],a:1},
{q:"Tradisi belis memiliki banyak nilai positif. Manakah gagasan penjelas yang mendukung gagasan pokok tersebut?",o:["Jumlah belis ditentukan secara sepihak oleh keluarga perempuan.","Belis merupakan simbol keseriusan dan ketulusan dari pihak perempuan.","Balasan dari keluarga perempuan biasanya permintaan dari pihak laki-laki.","Belis menjadi wahana penghormatan dan juga penyatuan kedua pihak keluarga.","Belis harus berupa gading gajah dan tidak bisa diganti dengan benda lain."],a:3},
{q:"Bagaimana hubungan makna antara paragraf kedua dan ketiga pada teks tersebut?",o:["Paragraf kedua mempertentangkan mengenai pelestarian tradisi belis beserta contohnya di paragraf ketiga.","Paragraf kedua memberikan penjelasan alasan tradisi belis yang digambarkan perlu dipertahankan di paragraf ketiga.","Paragraf ketiga memberikan perbandingan penerapan tradisi belis di beberapa daerah yang dijelaskan di paragraf kedua.","Paragraf ketiga menjelaskan tata laksana tradisi belis berdasarkan filosofinya seperti yang diurakan di paragraf kedua.","Paragraf ketiga memaparkan dampak negatif tradisi belis, meskipun maknanya baik seperti yang dijelaskan di paragraf kedua."],a:4},

const SHEET_URL="https://script.google.com/macros/s/AKfycbyQF-WBJLOMPxWVoED1z6QcrtiwbfEZViAk6_70taKgi4oZrp2CqBTnARbfbOgo1WXRwQ/exec";
const EX=["'Hajatan' berasal dari bahasa Jawa. Di teks, buwuhan adalah bantuan kepada orang yang mengadakan hajatan pada acara penting seperti pernikahan atau khitanan, jadi maknanya acara atau pesta untuk peristiwa penting.","Teks menyebut masyarakat meyakini bantuan akan kembali dalam bentuk serupa saat pemberi mengadakan hajatan. Karena itu penerima merasa wajib membalas. Perjanjian tertulis dan kewajiban memberi lebih tidak disebut di teks.","Paragraf kedua memaparkan akibat buwuhan (tekanan psikologis), yang kemudian menyebabkan terbaginya cara pandang masyarakat. Hubungannya sebab-akibat tentang perbedaan pandangan.","Kalimat diawali 'Oleh karena itu' sehingga berfungsi sebagai simpulan. Ia merangkum berbagai pandangan (tolong-menolong vs utang) lalu menegaskan perlunya pemahaman yang diluruskan.","Layur menolak berpikir buruk dan berdoa (penuh harap), serta setia menunggu dan merindukan Bapak (kasih sayang). Ia memang cemas, tetapi tidak panik atau menyalahkan keadaan.","Layur berseru 'Bapak sudah tiga hari telat pulang!'. Kekesalannya muncul karena Bapak tidak pulang tepat waktu seperti yang diharapkan. Teks tidak menyebut soal pamit atau jumlah ikan.","Layur digambarkan cemas dan rindu. Akhir yang membuatnya lega paling sesuai adalah pertemuan kembali: Bapak memeluknya dan sama-sama senang bertemu.","Ledakan itu disebut 'titik balik yang amat disesali Bapak' dan membuatnya meninggalkan usaha bondet. Ini menunjukkan ia sangat terkejut dan menyesal.","Urutan kronologis di teks: turis berfoto dan membuat konten, Pak Wayan memungut sampah, lalu petugas kebersihan datang. Melihat foto di media sosial terjadi malam hari, di akhir cerita.","Lewat dialog, kepedulian turis disebut hanya ada di 'caption'. Pesan moralnya: kesadaran lingkungan harus dibuktikan dengan tindakan nyata, bukan hanya kata-kata di media sosial.","Turis membuat konten 'liburan ramah lingkungan' tetapi membuang sampah sembarangan. Ini sindiran bagi orang yang peduli lingkungan hanya demi pencitraan.","Paragraf 1 memaparkan masalah (peningkatan sampah). Paragraf 2 dibuka dengan 'salah satu faktor penyebab', jadi isinya menguraikan penyebab masalah itu.","Benar: data sampah medis naik 30-50% mendukung tercemarnya lingkungan. Benar: 96% paket berplastik mendukung banyaknya limbah. Salah: peringkat ke-2 penyumbang sampah laut tidak berkaitan dengan kebakaran hutan.","'Bahu-membahu' adalah idiom yang berarti bekerja sama. Penulis memakainya untuk memperkuat pesan bahwa semua pihak harus berkolaborasi menjaga lingkungan.","Inflasi adalah kenaikan harga barang dan jasa secara terus-menerus dalam kurun waktu tertentu. Teks menyebut harga energi dan pangan sebagai pendorong utamanya.","Teks menyebut kenaikan harga energi dan pangan sebagai pendorong inflasi yang membuat tekanan biaya hidup, sehingga menggambarkan tantangan ekonomi global.","Ekor berita menyambung bagian akhir: prospek ekonomi bergantung pada inflasi, kebijakan moneter, dan situasi geopolitik. Maka lanjutan yang tepat adalah analisis skenario terkait ketiganya.","Teks menyebut Halaeng Heboung sebagai roh penjaga pertanian dan Selo Sen sebagai roh pelindung umat manusia. Jawabannya adalah sebutan kedua roh tersebut.","Kalimat 'pengingat kuat akan ketergantungan kita pada alam' langsung menunjukkan nilai spiritual dan ekologis. Pilihan lain hanya menyebut tampilan atau fungsi hiburan.","Paragraf ketiga menekankan nilai edukatif, paragraf keempat menegaskan perlunya pelestarian. Keduanya saling melengkapi sebagai argumen pelestarian tari Hudoq.","Paragraf terakhir diawali 'Dengan demikian'. Ia merangkum poin-poin penting dan menegaskan pentingnya pelestarian, sehingga cocok sebagai penutup.","'Sesepuh' berasal dari bahasa Jawa, artinya orang yang dituakan atau dihormati karena usia dan pengalaman, sering menjadi pemimpin adat. Di teks disandingkan dengan 'orang-orang tua'.","Paragraf kedua menyebut belis sebagai wahana penghormatan kepada perempuan dan penyatuan dua keluarga. Itu nilai positif yang mendukung gagasan pokok.","Paragraf kedua menjelaskan makna baik belis. Paragraf ketiga dibuka dengan 'Meskipun mengandung nilai positif' lalu memaparkan dampak negatifnya.","Kalimat 'Dengan demikian' mengusulkan cara atau perhitungan belis yang lebih fleksibel. Itu solusi konkret atas masalah beban finansial yang dibahas."];
const $=id=>document.getElementById(id),L="L",key=n=>n.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").slice(0,120);
let db=null,user=null,name="",TOTAL=0;G.forEach(g=>TOTAL+=g.q.length);
(async()=>{try{db=await claude.use("db");user=await claude.use("user");if(user&&user.isOwner()&&db)adminList()}catch(e){}})();
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function load(n){const k=key(n);if(SHEET_URL){try{const x=await (await fetch(SHEET_URL+"?k="+k)).json();if(x&&x.skor!=null)return x}catch(e){}}try{if(db){const d=await db.doc("hasil/"+k).get();if(d&&d.exists!==false){const v=d.data?d.data():d;if(v&&v.skor!=null)return v}}}catch(e){}
try{const v=localStorage.getItem("tka_"+k);if(v)return JSON.parse(v)}catch(e){}return null}
async function save(r){const k=key(r.nama);if(SHEET_URL){try{await fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({k,...r})})}catch(e){}}try{if(db)await db.doc("hasil/"+k).set(r)}catch(e){}try{localStorage.setItem("tka_"+k,JSON.stringify(r))}catch(e){}}
function getName(){name=$("nm").value.trim();if(name.length<2){$("msg").textContent="Nama wajib diisi dulu.";return false}$("msg").textContent="";return true}
function showRes(r){$("res").classList.remove("hide");$("res").innerHTML=`<h2>Nilai ${esc(r.nama)}</h2><div class="sc">${r.nilai}</div><p>Benar ${r.skor} dari ${r.total} soal · ${esc(r.waktu)}</p>`}
$("chk").onclick=async()=>{if(!getName())return;const r=await load(name);if(r){showRes(r);$("quiz").classList.add("hide")}else{$("res").classList.add("hide");$("msg").textContent="Belum ada nilai untuk nama ini. Silakan mulai mengerjakan."}};
$("go").onclick=async()=>{if(!getName())return;const r=await load(name);if(r){showRes(r);$("msg").textContent="Nama ini sudah mengerjakan; nilai ditampilkan di bawah.";return}
$("res").classList.add("hide");$("home").classList.add("hide");build()};
function build(){let n=0,h=`<div class="card"><b>Peserta: ${esc(name)}</b></div>`;
G.forEach((g,gi)=>{h+=`<div class="card"><h2>${g.t}</h2><div class="psg">${esc(g.p)}</div><p class="src">${esc(g.s)}</p></div>`;
g.q.forEach((q,qi)=>{n++;const id=`q${gi}_${qi}`;h+=`<div class="card" id="c${id}" data-n="${n}"><b>${n}.</b> ${esc(q.q)}`;
if(q.k=="tf"){h+=`<table class="tf"><tr><th></th><th>Benar</th><th>Salah</th></tr>`+q.o.map((o,i)=>`<tr><td>${esc(o)}</td><td><input type="radio" name="${id}_${i}" value="1"></td><td><input type="radio" name="${id}_${i}" value="0"></td></tr>`).join("")+`</table>`}
else h+=q.o.map((o,i)=>`<label class="o"><input type="radio" name="${id}" value="${i}"> ${"ABCDE"[i]}. ${esc(o)}</label>`).join("");
h+=`<div class="src fb"></div></div>`})});
h+=`<button id="sub">Kirim Jawaban &amp; Lihat Nilai</button><p class="src">Klik pilihan jawaban untuk langsung melihat penjelasan. Jawaban pertama dikunci dan dihitung sebagai nilai.</p>`;$("quiz").innerHTML=h;$("quiz").classList.remove("hide");scrollTo(0,0);$("sub").onclick=submit;
$("quiz").onchange=e=>{const t=e.target,c=t.closest(".card");if(!c||!c.id)return;const [gi,qi]=c.id.slice(2).split("_").map(Number),q=G[gi].q[qi];c.querySelectorAll(q.k=="tf"?`input[name="${t.name}"]`:"input").forEach(i=>i.disabled=true);showFb(c,q,c.id.slice(1),false)}}
function showFb(c,q,id,force){const ex=EX[c.dataset.n-1],f=c.querySelector(".fb");let ok,pre;
if(q.k=="tf"){const ans=q.a.map((_,i)=>{const e=c.querySelector(`input[name=${id}_${i}]:checked`);return e?+e.value:-1});if(ans.includes(-1)&&!force)return;ok=ans.every((v,i)=>v==q.a[i]);pre="Kunci: "+q.a.map(v=>v?"Benar":"Salah").join(", ")+". "}
else{const e=c.querySelector(`input[name=${id}]:checked`);if(!e&&!force)return;ok=!!e&&+e.value==q.a;pre="Jawaban benar: "+"ABCDE"[q.a]+". ";c.querySelectorAll("label.o").forEach((l,i)=>{if(i==q.a)l.classList.add("ok");else if(l.querySelector("input").checked)l.classList.add("no")})}
f.innerHTML=`<b style="color:var(--${ok?"ok":"no"})">${ok?"✓ Benar":"✗ Kurang tepat"}</b> · ${pre}<br>💡 ${esc(ex)}`;f.style.marginTop="8px";f.style.fontSize=".92rem";f.style.color="var(--t)"}
async function submit(){let sk=0,unans=0;
G.forEach((g,gi)=>g.q.forEach((q,qi)=>{const id=`q${gi}_${qi}`,c=$("c"+id);let ok=false;
if(q.k=="tf"){const ans=q.a.map((_,i)=>{const e=c.querySelector(`input[name=${id}_${i}]:checked`);return e?+e.value:-1});if(ans.includes(-1))unans++;ok=ans.every((v,i)=>v==q.a[i])}
else{const e=c.querySelector(`input[name=${id}]:checked`);if(!e)unans++;ok=e&&+e.value==q.a;c.querySelectorAll("label.o").forEach((l,i)=>{if(i==q.a)l.classList.add("ok");else if(l.querySelector("input").checked)l.classList.add("no")})}
if(ok)sk++;showFb(c,q,id,true)}));
const r={nama:name,skor:sk,total:TOTAL,nilai:Math.round(sk/TOTAL*100),waktu:new Date().toLocaleString("id-ID")};
$("sub").disabled=true;await save(r);showRes(r);scrollTo(0,0);if(unans)$("res").innerHTML+=`<p class="src">${unans} soal belum dijawab dan dihitung salah.</p>`;
$("res").innerHTML+=`<button onclick="location.reload()">Kembali</button>`}
async function adminList(){try{const s=await db.collection("hasil").get();const rows=[];s.forEach(d=>rows.push(d.data?d.data():d));rows.sort((a,b)=>b.nilai-a.nilai);
$("adm").classList.remove("hide");$("adm").innerHTML=`<h2>Daftar Nilai Semua Siswa (khusus pemilik)</h2><table><tr><th>Nama</th><th>Nilai</th><th>Benar</th></tr>`+rows.map(r=>`<tr><td>${esc(r.nama)}</td><td>${r.nilai}</td><td>${r.skor}/${r.total}</td></tr>`).join("")+`</table>`}catch(e){}}
