const T={
buwuhan:`<h3>Tradisi Buwuhan: Antara Gotong Royong dan Utang Piutang</h3><p>Tradisi buwuhan merupakan bagian dari budaya masyarakat Jawa, khususnya di kota-kota besar seperti Surabaya. Tradisi ini dilakukan ketika ada acara penting seperti pernikahan atau khitanan yang diadakan di daerah tersebut. Buwuhan merujuk pada kegiatan memberi bantuan, baik berupa barang, uang, maupun tenaga kepada seseorang yang sedang mengadakan hajatan, atau bisa juga disebut sebagai kegiatan menyumbang. Tradisi ini mencerminkan nilai gotong royong dan solidaritas sosial karena keluarga dan tetangga saling bahu-membahu dalam membantu sesama. Namun, praktik buwuhan tidak lepas dari unsur pertukaran atau dipandang sebagai utang. Masyarakat meyakini bahwa segala bentuk bantuan yang diberikan akan kembali dalam bentuk yang setara ketika si pemberi mengadakan hajatan serupa. Hal ini menyebabkan buwuhan tidak lagi dipandang murni sebagai hibah atau sedekah, tetapi sebagai bentuk “utang tidak tertulis” yang menimbulkan kewajiban moral untuk membalas.</p><p>Dalam praktiknya, buwuhan memang meringankan beban tuan rumah, tetapi dapat menimbulkan tekanan psikologis bagi penerima bantuan. Rasa malu dan kekhawatiran kehilangan harga diri mendorong sebagian orang untuk berutang demi mengembalikan buwuhan. Hal ini menyebabkan terbaginya cara pandang terhadap buwuhan. Ada yang melihatnya sebagai bentuk tolong-menolong, tetapi ada juga yang justru menganggapnya menjadi sistem utang piutang berbasis sosial. Sebagian pihak berpendapat bahwa buwuhan adalah hibah karena tujuannya adalah untuk membantu. Namun, apabila ada keharusan pengembalian, maka secara hukum dan etika, buwuhan telah bergeser dari semangat gotong royong menjadi sebuah kewajiban ekonomi yang membebani. Oleh karena itu, pemahaman masyarakat terhadap tradisi buwuhan perlu diluruskan agar nilai luhur tolong-menolong tetap terjaga tanpa menimbulkan beban yang tidak perlu.</p><p class="src">Sumber: Rachmawati, S. A., &amp; Anwar, M. K. (2021). Budaya dan Tradisi Buwuh sebagai Utang Piutang dalam Adat Pernikahan di Kota Surabaya. Jurnal Ekonomika dan Bisnis Islam, 4(3), hl 69–83.</p>`,
layur:`<h3>Layur, Teruslah Berlayar</h3><p>“Bapak, pulanglah,” lirih Layur berharap. Ini hari keenam. Tiga hari adalah waktu terlama nelayan berada di laut. Dengan susah payah, Layur berpindah duduk ke dalam sebuah perahu tua. Penyangga kedua kaki Layur yang tak utuh ia letakkan di sampingnya.</p><p>“Jangan-jangan...”</p><p>“Tidak ... Aku tidak boleh berpikiran buruk. Bapak pasti pulang dengan selamat. Aku akan tetap menunggunya di sini sambil berdoa.”</p><p>Layur masih ingat masa-masa dulu, ketika Bapak berlayar pada malam hari dan keesokan harinya sudah merapat kembali di pantai dengan membawa ikan berlimpah.</p><p>“Ayo! Siapa mau udang?” panggil Bapak. Layur berlari kencang bersama teman-temannya. Namun, itu adalah kenangan sepuluh tahun silam. Kini, udang dan ikan kecil adalah anugerah besar. Itu pun harus dijaring di tengah laut.</p><p>Layur ingat betul, Bapak adalah pembuat bondet paling disegani, juga berpengaruh di dusun. Setiap hari, nelayan silih berganti datang ke rumah memesan bondet. Hasil panen ikan berlimpah. Tinggal melemparkan bondet ke dalam laut dan ... <i>bum</i>! Berkuintal-kuintal ikan terapung tinggal diserok menggunakan jaring.</p><p>Sampai suatu ketika ...</p><p><i>DUAAAR!</i></p><p>Separuh rumah Layur luluh lantak karena simpanan bondet di gudang meledak. Ledakan bondet di gudang tak hanya merusak rumah tetapi juga mencelakai anak semata wayang. Ia berteriak minta tolong, menepuk-nepuk dadanya, dan menangis. Itulah titik balik yang amat disesali Bapak. Sejak itu, Bapak meninggalkan usaha pembuatan bondet. Demikian pula dengan warga Dusun Prau tempat mereka berdiam berangsur-angsur meninggalkan cara menangkap ikan dengan bondet.</p><p>Lamat-lamat terlihat kibaran layar bercorak biru. Layur beringsut menuruni perahu tempatnya duduk. Lambaian tangan bapaknya semakin jelas dan semakin dekat.</p><p>“Bapak dari mana? Bapak sudah tiga hari telat pulang!” Seru Layur kesal. Matanya berkaca-kaca, menahan rindu, dan cemas.</p><p class="src">Karya Anang YB. Bondet: istilah lokal yang merujuk pada bahan peledak rakitan, sering disebut juga bom ikan. Sumber: buku.kemdikbud.go.id/katalog/layur-tetaplah-berlayar (dengan pengubahan)</p>`,
pantai:`<h3>Pantai Bersih Tanpa Sampah</h3><p>Di sebuah daerah wisata yang terkenal dengan pantainya yang indah, pemerintah setempat gencar mengampanyekan “Pantai Bersih Tanpa Sampah.” Spanduk dan papan peringatan terpampang di berbagai sudut. Namun, kenyataannya seringkali berbeda.</p><p>Suatu sore, Pak Wayan, seorang nelayan tua yang sudah puluhan tahun melaut, sedang membersihkan jaringnya di tepi pantai. Di sampingnya, sekelompok turis muda asyik berpose untuk berfoto. Mereka mengenakan topi pantai yang modis, kacamata hitam, dan membawa botol minum berwarna-warni.</p><p>“Wah, pantainya bersih banget ya, <i>guys</i>!” seru salah satu turis sambil memegang ponselnya. “Pas banget buat konten ‘liburan ramah lingkungan’!”</p><p>Temannya menimpali, “Iya! Nanti <i>caption</i>-nya ‘Menikmati keindahan alam tanpa jejak, menjaga bumi kita tercinta!’”</p><p>Setelah puas berfoto dari berbagai sudut dengan beragam filter, mereka beranjak pergi. Namun mereka meninggalkan botol minuman plastik kosong, bungkus keripik, dan beberapa puntung rokok yang disembunyikan di balik semak-semak. Mereka bahkan tidak berusaha mencari tempat sampah yang hanya berjarak beberapa meter.</p><p>Pak Wayan hanya bisa menggelengkan kepala. Ia berjalan mendekat dan memungut sampah-sampah itu satu per satu. Ia sudah terbiasa dengan pemandangan ini. Para turis datang untuk menikmati keindahan, berfoto, membuat konten, lalu pergi meninggalkan “kenangan” dalam bentuk sampah.</p><p>Tak lama kemudian, seorang petugas kebersihan berseragam oranye datang dengan sapu dan karung. “Pak Wayan, sudah banyak lagi ya sampahnya?” tanyanya sambil menghela napas.</p><p>“Sudah biasa, Nak,” jawab Pak Wayan. “Ini namanya ‘sampah estetik’. Cuma bagus di foto, tapi busuk di mata dan bau di hidung.”</p><p>Petugas itu tersenyum masam. “Iya, Pak. Kata mereka peduli lingkungan, tapi pedulinya cuma di <i>caption</i> media sosial.”</p><p>Malam harinya, di akun media sosial Pak Wayan—yang diajari cucunya—ia melihat foto-foto pantai yang diunggah para turis tadi. Pantai tampak bersih sempurna, dihiasi filter matahari terbenam yang memukau. Ia membaca <i>caption</i>-nya: “Surgaku, jangan kau kotori!”</p><p>Pak Wayan hanya bisa tersenyum getir. Sepertinya, slogan “Pantai Bersih Tanpa Sampah” itu hanya berlaku untuk kamera dan media sosial. Sementara di balik layar, jejak yang ditinggalkan justru lebih nyata dan memprihatinkan daripada gambar yang dipamerkan.</p>`,
eko:`<h3>Pulihkan Ekosistem, Menjaga Planet Kita dari Generasi ke Generasi</h3><p>Berdasarkan hasil riset LIPI (Lembaga Ilmu Pengetahuan Indonesia) terjadi peningkatan sampah plastik selama pandemik. Hal ini disebabkan oleh penggunaan layanan <i>delivery</i> makanan lewat jasa transportasi <i>online</i>, 96% paket dibungkus dengan plastik yang tebal dan ditambah dengan <i>bubble wrap</i>. Selain itu selotip, bungkus plastik, dan <i>bubble wrap</i> merupakan pembungkus berbahan plastik yang paling sering ditemukan. Sampah medis juga melonjak. Kementerian Lingkungan Hidup dan Kehutanan (KLHK) menyatakan bahwa selama pandemi, terjadi peningkatan timbunan sampah medis sebesar 30% hingga 50%. Dari data tersebut, Indonesia merupakan negara ke-2 penyumbang polusi sampah di lautan (3,22 metrik ton per tahun).</p><p>Salah satu faktor penyebab dari pemasalahan tersebut adalah dengan pertambahan jumlah penduduk akan terjadi peningkatan aktivitas manusia dan daya konsumsi yang melonjak. Hal itu menyebabkan meningkatnya jumlah dan jenis limbah sehingga menyebabkan lingkungan menjadi tercemar. Selain sampah, penebangan pohon secara liar sampai pada kebakaran hutan menjadi penyumbang terbesar dalam kerusakan dalam ekosistem. Banyak aktivitas manusia yang mengancam pelestarian lingkungan sehingga menyebabkan ketidakseimbangan ekosistem. Manusia punya peran besar dalam menjaga keseimbangan ekosistem, bukan cuma untuk sekarang, tapi juga untuk generasi mendatang. Tanggung jawab dalam menjaga lingkungan, tentunya bukan hanya dibebankan oleh pemerintah saja, tetapi seluruh elemen masyarakat harus bahu-membahu dalam menjaga dan melestarikan lingkungan.</p><p>Bertepatan dengan peringatan Hari Lingkungan Hidup Sedunia, yang tidak hanya sebagai seremonial belaka, tentunya menjadi sebuah harapan dalam meningkatkan kesadaran menjaga dan melestarikan lingkungan. Selain itu, memberikan semangat baru bagi kita semua untuk komitmen menjaga lingkungan. Dengan memulai dari diri sendiri dan hal paling kecil, yaitu tidak membuang sampah sembarangan, terutama sampah plastik karena merusak ekosistem laut, tidak menebang pohon dengan liar hingga membuat gundul hutan. Mari bersama merobohkan jurang ekologis, memulihkan ekosistem bumi dengan pendekatan pengelolaan sumber daya alam yang adil dan berkelanjutan.</p><p class="src">Sumber: uiad.ac.id/2021/06/06/opini-pulihkan-ekosistem-menjaga-planet-kita-dari-generasi-ke-generasi/ (dengan pengubahan)</p>`,
prospek:`<h3>Prospek Ekonomi Global di Tengah Ketidakpastian</h3><p>Jakarta, Senin, 16 Juni 2025 – Perekonomian global terus menghadapi tantangan signifikan di tengah ketidakpastian geopolitik dan tekanan inflasi yang persisten. Analisis terbaru yang dirilis pada (Senin, 2/6/2025), oleh Dana Moneter Internasional (IMF) menunjukkan adanya divergensi dalam laju pemulihan ekonomi antarwilayah, di mana beberapa negara seperti Amerika Serikat dan India menunjukkan ketahanan yang lebih baik, sementara negara-negara di Eropa dan Tiongkok masih berjuang mengatasi dampak guncangan eksternal.</p><p>Kenaikan harga energi dan pangan tetap menjadi pendorong utama inflasi di banyak negara, dipicu oleh gangguan rantai pasok global dan konflik di Ukraina, memaksa bank sentral untuk mempertahankan kebijakan moneter yang ketat. Upaya ini, meskipun esensial untuk mengendalikan kenaikan harga, berpotensi mengerem pertumbuhan ekonomi. Para pengambil kebijakan dihadapkan pada dilema sulit: menyeimbangkan kebutuhan untuk meredam inflasi tanpa memicu resesi yang dalam.</p><p>“Kami melihat adanya perlambatan pertumbuhan global yang signifikan di tahun ini, dan risiko resesi menjadi lebih nyata jika bank sentral terlalu agresif dalam menaikkan suku bunga,” ujar seorang ekonom senior dari Bank Dunia, dalam sebuah webinar yang diadakan (Rabu, 11/6).</p><p>Di sisi lain, sektor manufaktur global menunjukkan tanda-tanda perlambatan, tercermin dari menurunnya indeks manajer pembelian (PMI) di beberapa ekonomi besar seperti Jerman dan Jepang. Penurunan permintaan ekspor dan gangguan rantai pasok masih menjadi perhatian utama bagi produsen. Namun, sektor jasa justru menunjukkan resiliensi yang lebih kuat, didukung oleh kembali normalnya aktivitas setelah pandemi, sebuah tren yang mulai terlihat sejak awal Desember 2024.</p><p>Pasar tenaga kerja di beberapa negara maju masih relatif ketat, dengan tingkat pengangguran yang rendah. Kondisi ini memberikan dukungan terhadap daya beli konsumen, meskipun tekanan biaya hidup yang tinggi dapat mengikis dampaknya. Sementara itu, investasi langsung asing (FDI) cenderung melambat, mencerminkan kehati-hatian investor di tengah prospek ekonomi yang tidak menentu.</p><p>Ke depan, koordinasi kebijakan ekonomi antarnegara akan menjadi kunci untuk menstabilkan kondisi global. Reformasi struktural yang bertujuan meningkatkan produktivitas dan daya saing juga dianggap krusial untuk memastikan pertumbuhan yang berkelanjutan dalam jangka panjang. Para ekonom memprediksi bahwa prospek ekonomi akan sangat bergantung pada evolusi inflasi, respons kebijakan moneter, dan perkembangan situasi geopolitik di seluruh dunia. Bagi Indonesia, kondisi ini menuntut kewaspadaan dan diversifikasi ekonomi agar tidak terlalu rentan terhadap gejolak global dalam kurun waktu tiga hingga enam bulan ke depan, terhitung sejak (16/6/2025).</p><p class="src">Sumber: Disadur dan diadaptasi dari rilis pers dan laporan Global Economic Prospects, Juni 2025 oleh World Bank (Bank Dunia).</p>`,
belis:`<h3>Tradisi Belis: Simbol Budaya yang Menyimpan Beban Finansial di Era Modern</h3><p>Belis adalah tradisi di wilayah Indonesia bagian timur seperti Nusa Tenggara Timur, yang secara umum di Indonesia dikenal dengan mas kawin atau mahar. Tradisi ini melambangkan penghormatan kepada wanita dan penyatuan keluarga. Namun, di balik nilainya, belis sering menjadi beban finansial berat bagi pihak laki-laki, yang kadang memicu tekanan psikologis dan mengganggu hubungan kekeluargaan. Beberapa pihak, terutama para sesepuh desa atau orang-orang tua, kadang terlalu kukuh untuk mempertahankan tradisi dan membuat tekanan dengan nilai yang semakin naik.</p><p>Belis memiliki makna yang mendalam dan dianggap sebagai bentuk pengakuan atas peran penting seorang perempuan di dalam keluarga. Belis merupakan representasi keseriusan dan komitmen seorang pria untuk membangun keluarga. Proses penyerahan belis tidak hanya dimaknai sebagai pertukaran materi, tetapi juga sebagai simbol penyatuan dua komunitas besar, yakni keluarga kedua belah pihak. Pada masyarakat Lamaholot misalnya, belis diwujudkan dalam bentuk gading gajah atau bala, yang besarnya disesuaikan dengan status sosial seorang perempuan. Selain itu, disertakan juga pelengkap belis seperti sarung tenun sutra dan ternak. Uniknya, meskipun belis dari pihak laki-laki, pihak keluarga perempuan memberikan balasan simbolis kepada pihak laki-laki dalam bentuk barang berharga lainnya. Tradisi ini mengajarkan keseimbangan dan saling menghargai di antara kedua belah pihak.</p><p>Meskipun belis mengandung nilai-nilai yang positif, tantangannya saat ini adalah menjaga agar tradisi tersebut tidak menjadi beban finansial yang berat. Tuntutan belis yang tinggi sering kali menjadi sumber tekanan, terutama bagi keluarga laki-laki. Dalam beberapa kasus, perkara belis dapat berimbas pada kesehatan mental hingga memicu tindakan tragis, seperti yang pernah terjadi di Kupang. Selain menjadi tantangan finansial, besarnya tuntutan materi untuk belis juga sering kali menimbulkan ketegangan dan konflik di antara pasangan dan keluarganya. Ketika keluarga perempuan menetapkan nominal belis yang tinggi, tidak jarang hal ini membangkitkan sentimen negatif dari pihak laki-laki yang merasa tertekan dan kehilangan martabat jika tidak mampu memenuhinya. Alhasil, penundaan pernikahan diambil guna memenuhi permintaan belis. Konflik semacam ini bisa merusak hubungan dua keluarga yang harusnya harmonis. Dengan demikian, perlu untuk memikirkan ulang makna belis dan menetapkan cara ataupun perhitungan besaran belis yang lebih fleksibel.</p><p class="src">Sumber: beritakini.co.id/detail/36671; krajan.id/belis-dalam-pernikahan-adat-ntt-simbol-budaya-atau-beban-sosial</p>`};

['Penerima buwuhan merasa harus mengembalikan bantuan yang diterima di kemudian hari.','Benar. Inilah ciri utang: ada kewajiban moral untuk membalas ketika pemberi mengadakan hajatan serupa (“utang tidak tertulis”).']],
why:'Gagasan pendukung harus langsung membuktikan ide pokok. Di sini ide pokoknya “buwuhan = utang”, jadi cari bukti adanya kewajiban mengembalikan.'},
{t:'buwuhan',q:'Hubungan makna paragraf kedua dan ketiga adalah ....',a:1,o:[
['perbedaan jenis buwuhan berdasarkan jenis acara yang dilangsungkan','Salah. Teks tidak membedakan jenis buwuhan berdasarkan acara.'],
['penjelasan sebab dan akibat dari perbedaan pandangan mengenai buwuhan','Benar. Paragraf kedua menjelaskan buwuhan dianggap utang karena bantuan diharapkan kembali setara (sebab). Paragraf berikutnya memaparkan akibatnya: tekanan psikologis, rasa malu, dan terbaginya cara pandang (hibah vs utang sosial).'],
['penjelasan dampak buruk dari adanya pandangan buwuhan sebagai sedekah','Salah. Dampak buruk justru timbul dari pandangan buwuhan sebagai <i>utang</i>, bukan sedekah.'],
['perbedaan tata cara buwuhan pada beberapa kelurahan atau desa di Surabaya','Salah. Tata cara per kelurahan tidak dibahas sama sekali.'],
['penjelasan hubungan hukum agama dengan pengertian masyarakat terhadap buwuhan','Salah. Teks hanya menyebut “hukum dan etika”; hukum agama tidak dibahas.']],
why:'Catatan: soal ini memakai paragraf “kedua dan ketiga” menurut naskah soal, padahal teks yang tampil di sini terdiri atas dua blok. Fokusnya tetap pada pola sebab (utang tidak tertulis) lalu akibat (tekanan dan pandangan terbelah).'},
{t:'buwuhan',q:'“Oleh karena itu, pemahaman masyarakat terhadap tradisi buwuhan perlu diluruskan agar nilai luhur tolong-menolong tetap terjaga tanpa menimbulkan beban yang tidak perlu.”<br>Kalimat tersebut dapat menjadi kesimpulan yang sesuai teks argumentasi tersebut karena ....',a:4,o:[
['merangkum sebab-akibat dari adanya tradisi buwuhan di wilayah Surabaya','Salah. Kalimat itu tidak lagi menjelaskan sebab-akibat; ia menawarkan jalan keluar.'],
['menyimpulkan ketidaksetujuan masyarakat terhadap penghapusan tradisi buwuhan','Salah. Teks tidak membahas penolakan terhadap penghapusan. Kalimat itu pun bukan ajakan menghapus.'],
['menyangkal pandangan negatif yang ada di masyarakat untuk pelestarian buwuhan','Salah. Penulis tidak menyangkal pandangan negatif; ia mengakui adanya beban lalu ingin meluruskan pemahaman.'],
['menyimpulkan berbagai pandangan masyarakat terhadap konsep buwuhan','Kurang tepat. Berbagai pandangan sudah diuraikan sebelumnya. Kalimat penutup bergerak lebih jauh, yaitu mengusulkan sikap.'],
['menggarisbawahi solusi untuk melestarikan tradisi buwuhan di seluruh wilayah Jawa','Benar (paling mendekati). Kata “perlu diluruskan agar ... tetap terjaga” adalah solusi: tradisi dipertahankan, bebannya dikurangi. Kunci memilih opsi ini karena fungsi kalimat sebagai solusi.']],
why:'Kunci fungsi kalimat penutup argumentasi: biasanya simpulan, penegasan, atau saran. Kata penanda “Oleh karena itu” dan “perlu” menandakan saran/solusi.'},
{t:'layur',q:'Berdasarkan teks tersebut, bagaimana sifat yang dimiliki oleh Layur?',a:2,o:[
['Nekat dan optimis','Salah. Layur tidak nekat. Ia sempat berpikir “jangan-jangan...” sehingga optimismenya rapuh.'],
['Mudah cemas dan tabah','Sebagian benar. Layur memang cemas, tetapi sifat yang paling menonjol dan didukung teks adalah harapan dan kasih sayang pada Bapak, bukan ketabahan.'],
['Penuh harap dan kasih sayang','Benar. Ia berdoa, menunggu, merindukan dan mencemaskan bapaknya (“menahan rindu, dan cemas”). Semua itu menunjukkan harapan dan kasih sayang.'],
['Suka menyendiri dan tegas','Salah. Ia menunggu bapaknya karena sayang, bukan karena suka menyendiri. Tidak ada bukti ketegasan.'],
['Cepat panik dan menyalahkan keadaan','Salah. Ia justru menenangkan diri (“Aku tidak boleh berpikiran buruk”) dan tidak menyalahkan siapa pun.']],
why:'Sifat tokoh disimpulkan dari tindakan dan ucapannya, bukan dari tebakan.'},
{t:'layur',q:'Apa yang menyebabkan Layur kesal kepada Bapak?',a:3,o:[
['Tidak pamit kepada Layur saat hendak berlayar','Salah. Tidak ada keterangan soal pamit.'],
['Tidak membawa banyak ikan dari laut','Salah. Layur memikirkan keselamatan Bapak, bukan hasil tangkapan.'],
['Tidak setuju Layur menunggu terlalu lama di pantai','Salah. Tidak ada percakapan seperti itu; Layur menunggu atas kemauannya sendiri.'],
['Tidak kunjung pulang setelah enam hari melaut','Benar. Hari itu hari keenam, padahal tiga hari adalah waktu terlama nelayan melaut. Maka Layur berseru “Bapak sudah tiga hari telat pulang!” dengan kesal.'],
['Tidak menepati janjinya untuk pulang tepat waktu ketika melaut','Salah (jebakan). Mirip jawaban benar, tetapi teks tidak menyebut janji apa pun. Penyebab yang eksplisit adalah keterlambatan.']],
why:'Pilih penyebab yang tertulis di teks, bukan yang sekadar terdengar masuk akal.'},
{t:'layur',q:'Bagaimana kisah yang sesuai untuk menutup cerita Layur merasa lega pada cerita tersebut?',a:0,o:[
['Bapak meminta maaf pada Layur dan menceritakan penyebabnya pulang terlambat','Benar. Konflik cerita adalah kecemasan dan kekesalan Layur karena keterlambatan. Penutup yang menjawabnya ialah Bapak menjelaskan penyebab dan meminta maaf, sehingga Layur lega.'],
['Bapak membimbing Layur pulang dan berjanji untuk tidak pulang terlambat lagi','Kurang tepat. Janji tidak menjelaskan mengapa Bapak terlambat, sehingga rasa penasaran dan cemas belum terjawab tuntas. Janji “tidak terlambat lagi” juga tidak realistis bagi nelayan.'],
['Bapak memeluk Layur dan merasa senang karena akhirnya ia bisa bertemu putrinya kembali','Kurang tepat. Teks tidak menyebut jenis kelamin Layur, dan sudut pandang pelegaan harus berpusat pada Layur, bukan Bapak.'],
['Layur membereskan sampan dan memberikan hasil tangkapan yang tidak seberapa kepada Bapak','Salah. Tidak berhubungan dengan kelegaan; Layur tidak ikut melaut dan kakinya tak utuh.'],
['Layur berterima kasih kepada Bapak karena telah menunggunya pulang dari melaut berhari-hari','Salah. Yang menunggu adalah Layur, bukan Bapak, sehingga logikanya terbalik.']],
why:'Soal prediksi akhir: pilih kelanjutan yang menuntaskan konflik utama dan konsisten dengan watak tokoh.'},
{t:'layur',q:'Bagaimana reaksi yang ditunjukkan oleh Bapak ketika rumahnya luluh lantak dan bondet buatannya melukai Layur?',a:2,o:[
['Merasa trauma dan membutuhkan waktu untuk menyendiri','Salah. Teks tidak menyebut Bapak menyendiri. Reaksinya langsung berupa penyesalan dan tindakan nyata.'],
['Menunjukkan respons yang biasa seperti tidak terjadi apa-apa','Salah. Peristiwa itu disebut “titik balik yang amat disesali Bapak”, jauh dari respons biasa.'],
['Sangat terkejut dan sungguh menyesal atas apa yang dilakukan','Benar. Ledakan bondet merusak rumah dan mencelakai anak semata wayangnya. Bapak amat menyesal dan berhenti membuat bondet.'],
['Marah terhadap orang lain dan merasa panik yang luar biasa','Salah. Bapak tidak menyalahkan orang lain; penyesalan ditujukan pada perbuatannya sendiri.'],
['Bingung dan berusaha mencerna terhadap apa yang telah terjadi','Salah. Tidak ada gambaran kebingungan. Teks menunjukkan keputusan tegas: meninggalkan usaha bondet.']],
why:'Reaksi tokoh dinilai dari akibat peristiwa pada keputusannya: ia berhenti membuat bondet, tanda penyesalan mendalam.'},
{t:'pantai',q:'Manakah urutan peristiwa berikut yang paling sesuai dengan isi teks?',a:1,o:[
['Pak Wayan melihat foto turis di media sosial → petugas kebersihan datang → turis membuat konten','Salah. Pak Wayan melihat foto di media sosial pada malam hari, yaitu peristiwa terakhir, bukan pertama.'],
['Turis berfoto dan membuat konten → Pak Wayan memungut sampah → petugas kebersihan datang','Benar. Turis berfoto dan pergi meninggalkan sampah, Pak Wayan memungutnya, lalu petugas datang dan berbincang dengannya.'],
['Pemerintah mengampanyekan kebersihan → Pak Wayan melihat foto turis → petugas kebersihan datang','Salah. Kampanye memang di awal, tetapi petugas datang sore hari, sebelum Pak Wayan melihat foto pada malam hari.'],
['Petugas kebersihan datang → turis membuat konten di media sosial → Pak Wayan memungut sampah','Salah. Petugas datang setelah Pak Wayan memungut sampah, bukan sebelum turis berfoto.'],
['Pak Wayan memungut sampah → turis membuat konten → pemerintah mengampanyekan kebersihan','Salah. Kampanye pemerintah disebut di paragraf pembuka, dan sampah baru ada setelah turis berfoto.']],
why:'Strategi: tandai penanda waktu (suatu sore, setelah, tak lama kemudian, malam harinya) lalu urutkan.'},
{t:'pantai',q:'Apa pesan moral yang disiratkan melalui dialog antara Pak Wayan dan petugas kebersihan?',a:2,o:[
['Menjaga kebersihan pantai adalah tanggung jawab utama pemerintah dan petugas kebersihan','Salah. Dialog justru menyindir pengunjung yang membuang sampah, bukan membebankan tugas pada pemerintah.'],
['Wisatawan seringkali menikmati keindahan alam tanpa memiliki kepedulian yang mendalam','Kurang tepat. Ini gambaran kenyataan, bukan pesan moral. Pesan moral berupa ajakan atau nilai yang bisa diterapkan.'],
['Kesadaran lingkungan sejati harus dibuktikan lewat tindakan, bukan hanya kata-kata di media sosial','Benar. Turis menulis caption peduli lingkungan namun meninggalkan sampah. Ucapan “pedulinya cuma di caption” adalah sindiran terhadap kepedulian yang hanya berupa kata.'],
['Media sosial bisa menjadi sarana positif untuk mengampanyekan kepedulian terhadap lingkungan','Salah. Teks menampilkan media sosial sebagai tempat pencitraan, bukan sarana kampanye positif.'],
['Nelayan dan petugas kebersihan sering kali menjadi pihak yang terdampak langsung oleh sampah','Kurang tepat. Fakta pendukung cerita, tetapi bukan pesan yang disampaikan lewat dialog sindiran.']],
why:'Pesan moral ditarik dari ironi cerita: kata-kata (caption) bertentangan dengan perbuatan (meninggalkan sampah).'},
{t:'pantai',q:'Manakah relevansi paling kuat antara sindiran dalam teks dengan realitas kehidupan sehari-hari, terutama terkait kesadaran lingkungan dan pencitraan?',a:1,o:[
['Kritik terhadap kampanye “Pantai Bersih” yang hanya menjadi slogan, menunjukkan kurangnya efektivitas program pemerintah','Kurang tepat. Sindiran ditujukan pada perilaku turis, bukan menilai efektivitas program pemerintah.'],
['Sindiran bagi pembuat konten “liburan ramah lingkungan” hanya untuk pencitraan semata karena tetap membuang sampah sembarangan','Benar. Soal menanyakan kesadaran lingkungan dan pencitraan. Turis memamerkan citra ramah lingkungan di media sosial tetapi meninggalkan sampah.'],
['Penggambaran turis yang kewalahan dan menghela napas mencerminkan beban kerja yang berat karena perilaku abai para pengunjung','Salah. Yang menghela napas adalah petugas kebersihan, bukan turis, dan isu beban kerja bukan fokus pencitraan.'],
['Keadaan Pak Wayan yang terbiasa dengan pemandangan sampah di pantai menunjukkan adanya budaya pasrah terhadap masalah lingkungan','Salah. Pak Wayan tidak pasrah: ia memungut sampah satu per satu. “Terbiasa” hanya menunjukkan ini sering terjadi.'],
['Kontras antara spanduk “Bersih Tanpa Sampah” dengan sampah kenangan yang ditinggalkan, menunjukkan perlunya pengawasan ketat','Kurang tepat. Kontrasnya ada, tetapi simpulan “perlu pengawasan ketat” tidak dinyatakan dan tidak menjawab inti soal, yaitu pencitraan.']],
why:'Relevansi dinilai dari kecocokan dengan kata kunci soal (kesadaran lingkungan dan pencitraan), bukan sekadar benar isinya.'},
{t:'eko',q:'Bagaimana hubungan makna antara paragraf 1 dan paragraf 2 dalam teks tersebut?',a:4,o:[
['Paragraf 2 menjelaskan akibat dari fenomena sampah yang diuraikan di paragraf 1','Salah. Paragraf 2 membahas penyebab (pertambahan penduduk, konsumsi), bukan akibat.'],
['Paragraf 2 menyajikan solusi awal untuk permasalahan yang diperkenalkan di paragraf 1','Salah. Solusi baru muncul di paragraf 3 (mulai dari diri sendiri).'],
['Paragraf 2 memberikan contoh spesifik dari jenis sampah yang disebutkan di paragraf 1','Salah. Contoh jenis sampah (plastik, medis) ada di paragraf 1; paragraf 2 menambah faktor penyebabnya.'],
['Paragraf 2 mengkritisi data yang rancu tentang sampah yang disajikan di paragraf 1','Salah. Tidak ada kritik atau keraguan terhadap data.'],
['Paragraf 2 menguraikan penyebab dari permasalahan yang dijabarkan di paragraf 1','Benar. Paragraf 1 memaparkan masalah beserta data. Paragraf 2 dibuka dengan “Salah satu faktor penyebab dari permasalahan tersebut...”, jelas penanda sebab.']],
why:'Penanda hubungan: “faktor penyebab” = sebab; “akibatnya” = akibat; “misalnya” = contoh.'},
{t:'eko',s:['Peningkatan aktivitas manusia yang menyebabkan lingkungan tercemar didukung oleh data lonjakan timbunan sampah medis sebesar 30–50%','Tingginya jumlah dan jenis limbah didukung oleh data bahwa 96% paket dibungkus dengan plastik tebal dan <i>bubble wrap</i>','Kebakaran hutan yang merusak ekosistem didukung data bahwa Indonesia merupakan negara ke-2 penyumbang sampah'],k:[true,true,false],q:'Aktivitas manusia memberikan dampak besar terhadap pencemaran lingkungan di Indonesia. Data apa saja yang mendukung opini penulis tersebut? Pilih Benar atau Salah untuk setiap pernyataan.',ex:['Benar. Lonjakan sampah medis 30–50% adalah data nyata dari aktivitas manusia selama pandemi.','Benar. Data 96% paket berbungkus plastik tebal dan bubble wrap menunjukkan banyaknya jumlah dan jenis limbah.','Salah. Data peringkat ke-2 penyumbang sampah laut adalah soal sampah, bukan kebakaran hutan. Data dan klaim berbeda jenis tidak boleh dipasangkan.'],why:'Periksa tiap pernyataan satu per satu: apakah datanya benar-benar membuktikan klaimnya?'},
{t:'eko',q:'Mengapa penulis memilih istilah “bahu-membahu” untuk menggambarkan peran semua pihak dalam upaya pelestarian lingkungan?',a:0,o:[
['Memperkuat makna pentingnya kolaborasi berbagai pihak untuk mencapai tujuan','Benar. Bahu-membahu berarti bekerja sama atau saling membantu. Penulis menekankan seluruh elemen masyarakat, bukan hanya pemerintah.'],
['Memberikan sedikit kesan informal yang mungkin kurang pas untuk teks opini','Salah. Idiom ini lazim dalam teks opini dan dipilih karena maknanya, bukan untuk kesan informal.'],
['Mengindikasikan bahwa idiom lebih cocok digunakan untuk konteks fisik','Salah. Dalam teks idiom dipakai secara kiasan untuk kerja sama, bukan kegiatan fisik.'],
['Menyiratkan adanya paksaan atau tekanan dari satu pihak kepada pihak lain','Salah. Bahu-membahu bermakna setara dan sukarela, tidak ada paksaan.'],
['Menunjukkan bahwa konteks ini terlalu ambigu dan tidak ada definisi yang jelas','Salah. Konteksnya jelas: tanggung jawab seluruh elemen masyarakat.']],
why:'Soal pilihan kata: tanyakan apa efek makna kata itu terhadap pesan teks.'},
{t:'prospek',q:'Fenomena yang menggambarkan “inflasi” berdasarkan teks di atas adalah ...',a:1,o:[
['Pengencangan anggaran negara karena kurangnya barang dan jasa','Salah. Inflasi bukan soal anggaran negara. Teks mengaitkannya dengan harga, bukan kelangkaan anggaran.'],
['Kenaikan harga barang dan jasa secara terus menerus dalam kurun waktu tertentu','Benar. Teks menyebut kenaikan harga energi dan pangan sebagai pendorong inflasi, dan bank sentral mengetatkan kebijakan “untuk mengendalikan kenaikan harga”. Definisi umum inflasi: harga naik terus-menerus.'],
['Biaya yang mendorong kemandirian ekonomi hingga mampu bersaing secara global','Salah. Tidak ada kaitannya dengan kemandirian atau daya saing.'],
['Pergeseran tren pasar global terhadap produk-produk dari Indonesia','Salah. Teks tidak membahas tren pasar untuk produk Indonesia.'],
['Lambatnya sektor manufaktur global akibat menurunnya pembelian','Jebakan. Ini fenomena yang disebut teks (PMI turun), tetapi itu perlambatan manufaktur, bukan definisi inflasi.']],
why:'Pilih definisi yang menjelaskan konsep, bukan fenomena lain yang kebetulan ada di teks.'},
{t:'prospek',q:'Peristiwa yang menggambarkan tantangan perekonomian global adalah ...',a:3,o:[
['Bank sentral di seluruh dunia mengesampingkan kebijakan moneter demi pertumbuhan ekonomi global','Salah. Teks menyebut bank sentral justru mempertahankan kebijakan moneter yang ketat.'],
['Geopolitik berperan penting dalam menjaga kestabilan dan kekuatan perekonomian pada skala global','Salah. Geopolitik di teks adalah sumber ketidakpastian, bukan penjaga kestabilan.'],
['Pertumbuhan ekonomi melambat sehingga memicu terjadinya resesi yang dialami masyarakat secara global','Salah. Resesi baru dibahas sebagai risiko (“risiko resesi menjadi lebih nyata”), belum benar-benar terjadi.'],
['Harga energi, pangan, dan komoditas lainnya yang tidak menentu terus menekan daya beli masyarakat','Benar. Kenaikan harga energi dan pangan adalah pendorong utama inflasi dan menjadi tantangan nyata bagi para pengambil kebijakan.'],
['Geopolitik memperlancar jalur perdagangan dan produksi sehingga menciptakan inflasi besar-besaran','Salah. Teks menyebut konflik justru mengganggu rantai pasok, bukan memperlancar.']],
why:'Cek tiap opsi dengan teks: banyak opsi memutarbalikkan hubungan sebab-akibat.'},
{t:'prospek',q:'Manakah pernyataan yang dapat menjadi kelanjutan teks tersebut?',a:3,o:[
['Peran aktif IMF dan Bank Dunia dalam menanggulangi krisis ekonomi dan pembentukan SDM di negara berkembang secara global','Salah. Pembentukan SDM tidak dibahas; berita berfokus pada prospek ekonomi.'],
['Dampak langsung kebijakan suku bunga bank sentral terhadap tingkat pengangguran di setiap negara dan menjadi masalah global','Salah. Pasar tenaga kerja hanya disinggung sepintas, dan klaim “setiap negara” terlalu luas.'],
['Analisis mendalam mengenai skenario dan kemungkinan-kemungkinan terkait evolusi inflasi, respons kebijakan, serta situasi geopolitik','Hampir sama dengan opsi berikutnya, tetapi tidak menyebut “global” dan menambahkan kata “mendalam” yang tidak dijanjikan teks.'],
['Analisis mengenai skenario dan kemungkinan-kemungkinan terkait evolusi inflasi, respons kebijakan, serta situasi geopolitik global','Benar (menurut pembahasan). Paragraf akhir menyebut prospek sangat bergantung pada evolusi inflasi, respons kebijakan moneter, dan situasi geopolitik di seluruh dunia, sehingga kelanjutannya adalah analisis skenario atas tiga hal itu. Catatan: opsi ini dan sebelumnya sangat mirip; cocokkan dengan kunci resmi bila ada.'],
['Pentingnya investasi di sektor manufaktur untuk meningkatkan ekspor dan mengurangi gangguan rantai pasok secara global','Salah. Manufaktur sedang melambat; teks tidak mengarah pada anjuran investasi.']],
why:'Ekor berita biasanya menindaklanjuti kalimat terakhir. Cari opsi yang mengulang ketiga faktor di sana.'},
{n:'22',t:'belis',q:'Apa makna kata <i>sesepuh</i> pada teks tersebut?',a:1,o:[
['keluarga yang dihormati oleh seluruh warga desa','Salah. Sesepuh merujuk pada orang, bukan keluarga.'],
['orang yang dituakan atau dijadikan pemimpin','Benar. Dalam teks, sesepuh desa disejajarkan dengan orang-orang tua yang berpengaruh dalam mempertahankan tradisi.'],
['masyarakat yang memiliki peran penting','Kurang tepat. Terlalu umum dan merujuk pada kelompok masyarakat, bukan sosok yang dituakan.'],
['pengurus atau perangkat desa yang sudah tua','Salah. Sesepuh dihormati karena usia dan pengaruh, bukan jabatan perangkat desa.'],
['laki-laki yang sudah menikah dan memiliki anak','Salah. Status menikah atau punya anak bukan syarat sesepuh.']],
why:'Sesepuh = orang yang dituakan karena usia, pengalaman, atau kedudukan.'},
{n:'23',t:'belis',q:'Tradisi belis memiliki banyak nilai positif. Manakah gagasan penjelas yang mendukung gagasan pokok tersebut?',a:3,o:[
['Jumlah belis ditentukan secara sepihak oleh keluarga perempuan.','Salah. Ini bukan nilai positif, melainkan sumber tekanan.'],
['Belis merupakan simbol keseriusan dan ketulusan dari pihak perempuan.','Salah. Teks menyebut belis sebagai keseriusan dan komitmen pihak <i>pria</i>, bukan perempuan.'],
['Balasan dari keluarga perempuan biasanya permintaan dari pihak laki-laki.','Salah. Balasan keluarga perempuan berupa barang berharga, bukan permintaan.'],
['Belis menjadi wahana penghormatan dan juga penyatuan kedua pihak keluarga.','Benar. Teks menyebut belis melambangkan penghormatan kepada perempuan dan penyatuan dua komunitas besar.'],
['Belis harus berupa gading gajah dan tidak bisa diganti dengan benda lain.','Salah. Gading gajah hanyalah contoh pada masyarakat Lamaholot; teks tidak menyatakan keharusan.']],
why:'Gagasan penjelas harus mendukung gagasan pokok: nilai positif belis.'},
{n:'24',t:'belis',q:'Bagaimana hubungan makna antara paragraf kedua dan ketiga pada teks tersebut?',a:4,o:[
['Paragraf kedua mempertentangkan mengenai pelestarian tradisi belis beserta contohnya di paragraf ketiga.','Salah. Paragraf kedua menjelaskan makna, bukan mempertentangkan pelestarian.'],
['Paragraf kedua memberikan penjelasan alasan tradisi belis yang digambarkan perlu dipertahankan di paragraf ketiga.','Salah. Urutannya terbalik: paragraf ketiga justru menyoroti masalahnya.'],
['Paragraf ketiga memberikan perbandingan penerapan tradisi belis di beberapa daerah yang dijelaskan di paragraf kedua.','Salah. Tidak ada perbandingan antardaerah; hanya masyarakat Lamaholot dan Kupang sebagai contoh.'],
['Paragraf ketiga menjelaskan tata laksana tradisi belis berdasarkan filosofinya seperti yang diuraikan di paragraf kedua.','Salah. Paragraf ketiga membahas tantangan, bukan tata laksana.'],
['Paragraf ketiga memaparkan dampak negatif tradisi belis, meskipun maknanya baik seperti yang dijelaskan di paragraf kedua.','Benar. Paragraf kedua memaparkan makna dan nilai positif; paragraf ketiga dibuka dengan “Meskipun belis mengandung nilai-nilai yang positif...” lalu menguraikan dampak buruknya. Ini hubungan kontras.']],
why:'Kata “meskipun” menandai pertentangan antara nilai positif dan dampak negatif.'},
{n:'25',t:'belis',q:'“Dengan demikian, perlu untuk memikirkan ulang makna belis dan menetapkan cara ataupun perhitungan besaran belis yang lebih fleksibel.”<br>Kalimat tersebut dapat menjadi kesimpulan yang sesuai teks argumentasi tersebut karena ....',a:4,o:[
['menekankan pentingnya menjaga tradisi belis agar tidak hilang ditelan zaman','Kurang tepat. Kalimat itu mengusulkan perubahan cara perhitungan, bukan sekadar menjaga agar tidak hilang.'],
['mengusulkan agar tradisi belis dihapuskan sepenuhnya demi kesejahteraan keluarga','Salah. Yang diusulkan adalah memikirkan ulang dan membuat lebih fleksibel, bukan menghapus.'],
['menegaskan bahwa belis adalah pertukaran materi semata dan tidak memiliki makna lain','Salah. Teks menegaskan belis tidak hanya pertukaran materi.'],
['merangkum masalah utama yang ditimbulkan oleh belis yang kaku, yaitu konflik dan tekanan','Kurang tepat. Masalah sudah diuraikan sebelumnya; kalimat “Dengan demikian” ini beralih ke jalan keluar.'],
['menyimpulkan solusi konkret untuk masalah yang dibahas, yaitu beban finansial akibat belis','Benar. Kalimat menawarkan solusi (memikirkan ulang makna dan membuat perhitungan fleksibel) untuk masalah beban finansial belis.']],
why:'Kata “perlu” dan “menetapkan” menandai saran atau solusi pada kalimat penutup argumentasi.'}
];
let i=0,ans=Array(Q.length).fill(null),chk=Array(Q.length).fill(false),fin=false;
const L='ABCDE',$=s=>document.querySelector(s);
function nav(){$('#nav').innerHTML=Q.map((q,k)=>{let c=k==i&&!fin?'cur ':'';if(chk[k])c+=ans[k]==q.a?'ok':'bad';else if(ans[k]!==null)c+='done';return `<button class="${c}" onclick="go(${k})" aria-label="Soal ${k+1}">${k+1}</button>`}).join('')}
function go(k){i=k;fin=false;draw()}
function pick(k){if(chk[i])return;ans[i]=k;draw()}
function check(){chk[i]=true;draw()}
function draw(){nav();const q=Q[i],c=chk[i];
if(fin){const s=Q.filter((x,k)=>ans[k]==x.a).length;$('#app').innerHTML=`<div class="card"><p class="sub">Hasil bagian 1</p><p class="score">${s} / ${Q.length}</p><p>${s==Q.length?'Sempurna. Lanjut ke bagian berikutnya.':'Tekan nomor soal di atas untuk meninjau pembahasan, terutama yang berwarna merah atau belum dijawab.'}</p></div>`;return}
$('#app').innerHTML=`<div class="card txt">${T[q.t]}</div><div class="card"><p class="q">${i+1}. ${q.q}</p>`+q.o.map((o,k)=>{let cl='opt';if(c)cl+=k==q.a?' ok':(k==ans[i]?' bad':'');else if(k==ans[i])cl+=' sel';return `<button class="${cl}" onclick="pick(${k})"><b>${L[k]}.</b> ${o[0]}${c?`<span class="ex">${o[1]}</span>`:''}</button>`}).join('')+(c?`<p class="why">${q.why}</p>`:'')+`<div class="row"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i-1})">Sebelumnya</button>${c?(i<Q.length-1?`<button class="btn" onclick="go(${i+1})">Berikutnya</button>`:`<button class="btn" onclick="fin=true;draw()">Lihat hasil</button>`):`<button class="btn" ${ans[i]===null?'disabled':''} onclick="check()">Periksa</button>`}</div></div>`;
}
const ok=k=>{const q=Q[k],a=ans[k];return q.s?!!a&&q.s.every((_,j)=>a[j]===q.k[j]):a==q.a},dn=k=>Q[k].s?!!ans[k]&&Q[k].s.every((_,j)=>ans[k][j]!=null):ans[k]!==null;
function nav(){$('#nav').innerHTML=Q.map((q,k)=>{let c=k==i&&!fin?'cur ':'';if(chk[k])c+=ok(k)?'ok':'bad';else if(dn(k))c+='done';return `<button class="${c}" onclick="go(${k})" aria-label="Soal ${q.n}">${q.n}</button>`}).join('')}
function sel(j,v){if(chk[i])return;(ans[i]=ans[i]||Array(Q[i].s.length).fill(null))[j]=v;draw()}
Q.forEach((q,k)=>q.n=q.n||String(k+1));
function draw(){nav();const q=Q[i],c=chk[i];
if(fin){const s=Q.filter((x,k)=>ok(k)).length;$('#app').innerHTML=`<div class="card"><p class="sub">Hasil sementara</p><p class="score">${s} / ${Q.length}</p><p>Tekan nomor soal di atas untuk meninjau pembahasan, terutama yang merah atau belum dijawab.</p></div>`;return}
let b;if(q.s){b=q.s.map((s,j)=>{const a=(ans[i]||[])[j];return `<div style="margin-bottom:10px"><div>${j+1}. ${s}</div><div style="display:flex;gap:8px;margin-top:6px">`+[true,false].map(v=>{let cl='opt';if(c){if(v===q.k[j])cl+=' ok';else if(v===a)cl+=' bad'}else if(v===a)cl+=' sel';return `<button class="${cl}" style="width:auto;margin:0;flex:1" onclick="sel(${j},${v})">${v?'Benar':'Salah'}</button>`}).join('')+`</div>${c?`<span class="ex">${q.ex[j]}</span>`:''}</div>`}).join('')}
else b=q.o.map((o,k)=>{let cl='opt';if(c)cl+=k==q.a?' ok':(k==ans[i]?' bad':'');else if(k==ans[i])cl+=' sel';return `<button class="${cl}" onclick="pick(${k})"><b>${L[k]}.</b> ${o[0]}${c?`<span class="ex">${o[1]}</span>`:''}</button>`}).join('');
$('#app').innerHTML=`<div class="card txt">${T[q.t]}</div><div class="card"><p class="q">${q.n}. ${q.q}</p>${b}${c?`<p class="why">${q.why}</p>`:''}<div class="row"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i-1})">Sebelumnya</button>${c?(i<Q.length-1?`<button class="btn" onclick="go(${i+1})">Berikutnya</button>`:`<button class="btn" onclick="fin=true;draw()">Lihat hasil</button>`):`<button class="btn" ${dn(i)?'':'disabled'} onclick="check()">Periksa</button>`}</div></div>`}
draw();
</script></body></html>
